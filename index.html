<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Grammar Test Preview</title><style>body{margin:0;background:#f5f7fb;font:16px system-ui;color:#172338}.wrap{max-width:680px;margin:auto;padding:20px}header{background:#173b73;color:white;padding:23px;border-radius:16px}h1{margin:0 0 8px}.muted{opacity:.8}.pill{display:inline-block;background:#e8f0ff;color:#173b73;padding:6px 10px;border-radius:20px;font-size:12px;margin:14px 0}.q{background:white;border:1px solid #dce2ed;border-radius:14px;padding:18px;margin:14px 0}.q h3{font-size:17px}.opt{display:block;padding:12px;margin:8px 0;border:1px solid #dce2ed;border-radius:10px;cursor:pointer}.opt:has(input:checked){border-color:#245cb6;background:#edf4ff}.opt input{margin-right:10px}.feedback{margin-top:10px;font-size:14px}.good{color:#137342}.bad{color:#af302e}button{border:0;background:#1d4f9d;color:white;border-radius:12px;padding:14px 20px;font-size:16px;cursor:pointer;width:100%}button:disabled{opacity:.5}#result{background:#e7f4e9;padding:16px;border-radius:14px;margin:16px 0}footer{font-size:13px;color:#526079;margin:24px 0}</style></head><body><main class="wrap"><header><h1>English Grammar Test</h1><div class="muted">Tenses · छोटा Demo Test · 5 Questions</div></header><div class="pill">DEMO ONLY — ये PYQs नहीं हैं</div><div id="questions"></div><button id="submit">Submit Test</button><div id="result" hidden aria-live="polite"></div><button id="again" hidden>फिर से टेस्ट दें</button><footer>Original exam papers, official answer keys, changed answers और deleted questions का अलग verified archive अगले चरण में जुड़ेगा।</footer></main><script>const qs=[{q:"She ___ to school every day.",o:["go","goes","going","gone"],a:1,e:"Every day habitual action है; singular subject 'She' के साथ 'goes' आता है."},{q:"They ___ cricket when it started raining.",o:["play","are playing","were playing","have played"],a:2,e:"Past में एक काम जारी था जब दूसरा हुआ: past continuous."},{q:"I ___ my homework already.",o:["finish","finished","have finished","am finishing"],a:2,e:"'Already' के साथ यहाँ present perfect उपयुक्त है."},{q:"By next Monday, he ___ the project.",o:["will complete","will have completed","completed","has completed"],a:1,e:"Future के निश्चित समय तक काम पूरा होने के लिए future perfect."},{q:"Look! The baby ___.",o:["sleeps","slept","is sleeping","has slept"],a:2,e:"Look! इस समय चल रही क्रिया दिखाता है: present continuous."}];const root=document.getElementById('questions');root.innerHTML=qs.map((x,i)=>'<section class="q"><h3>'+(i+1)+'. '+x.q+'</h3>'+x.o.map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'">'+String.fromCharCode(65+j)+'. '+o+'</label>').join('')+'<div class="feedback" id="f'+i+'"></div></section>').join('');document.getElementById('submit').onclick=()=>{let score=0,answered=0;qs.forEach((x,i)=>{let v=document.querySelector('input[name="q'+i+'"]:checked');if(v)answered++;if(v&&+v.value===x.a)score++;const f=document.getElementById('f'+i);f.className='feedback '+(v&&+v.value===x.a?'good':'bad');f.textContent=(v&&+v.value===x.a?'✓ सही':'✗ सही उत्तर: '+String.fromCharCode(65+x.a)+'. '+x.o[x.a])+' — '+x.e;});if(answered!==qs.length){alert('कृपया सभी 5 सवालों के उत्तर दें।');return;}document.querySelectorAll('input').forEach(x=>x.disabled=true);document.getElementById('submit').hidden=true;document.getElementById('again').hidden=false;const r=document.getElementById('result');r.hidden=false;r.textContent='आपका Score: '+score+' / '+qs.length+' ('+Math.round(score/qs.length*100)+'%)';r.scrollIntoView({behavior:'smooth',block:'center'});};document.getElementById('again').onclick=()=>location.reload();</script></body></html>
