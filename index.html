<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RajPaper | Rajasthan Exam Papers</title><style>body{font-family:system-ui;background:#f6f8fc;margin:0;color:#17233b}.wrap{max-width:720px;margin:55px auto;padding:20px}header{font-size:24px;font-weight:800}h1{text-align:center;margin-top:60px}p{text-align:center;color:#607086}input{width:100%;box-sizing:border-box;padding:19px;border:1px solid #d6dce7;border-radius:14px;font-size:18px}#list{margin-top:24px}.paper{background:white;border:1px solid #e1e5ed;border-radius:12px;padding:17px;margin:10px 0}small{color:#68758a}a{color:#175bd5}#status{margin-top:20px}</style><div class="wrap"><header>📚 RajPaper</header><h1>राजस्थान के परीक्षा पेपर</h1><p>नाम लिखें, पेपर खोजें और आधिकारिक PDF खोलें</p><input id="search" placeholder="REET, Patwari, 2nd Grade..." autofocus><div id="status"></div><div id="list"></div></div><script>let papers=[];const list=document.querySelector('#list'),status=document.querySelector('#status'),input=document.querySelector('#search');function render(){let q=input.value.trim().toLowerCase();let result=papers.filter(p=>[p.name,p.exam,p.year,p.shift].join(' ').toLowerCase().includes(q));status.textContent=result.length+' verified papers';list.innerHTML='';result.forEach(p=>{let d=document.createElement('div');d.className='paper';let t=document.createElement('strong');t.textContent=p.name||p.exam;d.append(t);let s=document.createElement('small');s.textContent=' · '+(p.year||'')+' '+(p.shift||'');d.append(s);let a=document.createElement('p');a.style.textAlign='left';let l=document.createElement('a');l.textContent='Official PDF ↗';l.href=p.pdf_url;l.target='_blank';l.rel='noopener noreferrer';a.append(l);d.append(a);list.append(d)});if(!result.length){let d=document.createElement('p');d.textContent='अभी कोई सत्यापित पेपर नहीं मिला।';list.append(d)}}input.addEventListener('input',render);fetch('data/papers.json').then(r=>r.json()).then(d=>{papers=Array.isArray(d)?d:[];render()}).catch(()=>{status.textContent='डेटा लोड नहीं हो सका'})</script></html>
