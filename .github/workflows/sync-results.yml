name: Update RajResults from official sites
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-results.yml'
  workflow_dispatch:
  schedule:
    - cron: '11 2,8,14,20 * * *'

permissions:
  contents: write

concurrency:
  group: rajresults-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Results preview branch
        uses: actions/checkout@v4
        with:
          ref: preview-results
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch results from official websites
        run: python scripts/sync_results.py
      - name: Validate all published result URLs
        run: python scripts/validate_results.py
      - name: Commit verified results and review candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/results.json data/pending-results.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync official Rajasthan result links'
            git push origin HEAD:preview-results
          fi
