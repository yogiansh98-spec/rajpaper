name: Validate RajPaper catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3,15 * * *'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_papers.py
